# BloodLink read operations.
#
# Conventions:
#   - Complex reads use raw `_select` / `_selectFirst` so the server SQL ports
#     almost 1:1. SQL output columns are aliased to the exact camelCase names
#     the app services already consume.
#   - Role and ownership checks live inside the SQL WHERE clauses
#     (`requester_uid = $1`, staff gates, ...), so a caller that invokes the
#     wrong operation simply gets an empty result instead of leaked rows.
#   - `@auth(level: PUBLIC)` operations carry `insecureReason` because they
#     read public data without referencing `auth.uid`.

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

# The signed-in user row. `role`/`bloodGroup`/`isVerified` gate every screen.
query GetMe @auth(level: USER) {
  me: user(key: { uid_expr: "auth.uid" }) {
    uid
    role
    fullName
    email
    mobile
    district
    bloodGroup
    isVerified
  }
}

# ---------------------------------------------------------------------------
# Public reads (signed-out urgent path)
# ---------------------------------------------------------------------------

# Every blood bank with its total stocked units.
# Mirrors `GET /blood-banks`.
query ListBloodBanks
  @auth(level: PUBLIC, insecureReason: "Anyone may view public blood-bank locations and stock levels.") {
  banks: _select(
    sql: """
    SELECT b.id AS id,
           b.name AS name,
           b.district AS district,
           b.address AS address,
           b.phone AS phone,
           b.hours AS hours,
           b.is_verified AS "isVerified",
           b.note AS note,
           COALESCE((SELECT SUM(bi.units) FROM blood_inventory bi WHERE bi.bank_id = b.id), 0) AS "totalUnits"
      FROM blood_banks b
     ORDER BY b.is_verified DESC, b.name
    """
  )
}

# One blood bank with its full inventory matrix.
# Mirrors `GET /blood-banks/:id`.
query GetBloodBank($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Anyone may view a blood bank's public stock levels.") {
  bank: _selectFirst(
    sql: """
    SELECT jsonb_build_object(
             'id', b.id,
             'name', b.name,
             'district', b.district,
             'address', b.address,
             'phone', b.phone,
             'hours', b.hours,
             'isVerified', b.is_verified,
             'note', b.note,
             'inventory', COALESCE((
               SELECT jsonb_agg(jsonb_build_object(
                          'bloodGroup', bi.blood_group,
                          'component', bi.component,
                          'units', bi.units,
                          'updatedAt', bi.updated_at)
                         ORDER BY bi.blood_group, bi.component)
                 FROM blood_inventory bi WHERE bi.bank_id = b.id
             ), '[]'::jsonb)
           ) AS "bank"
      FROM blood_banks b
     WHERE b.id = $1::uuid
    """,
    params: [$id]
  )
}

# Live donor coverage for the sign-in reassurance card.
# Mirrors `GET /donors/stats`. The client derives provinces and monograms.
query GetActiveDonorStats
  @auth(level: PUBLIC, insecureReason: "Anyone may view the aggregate donor-coverage count.") {
  donors: _select(
    sql: """
    SELECT u.full_name AS "fullName",
           u.district AS district
      FROM users u
      JOIN donor_availability d ON d.user_id = u.uid
     WHERE (u.role = 'donor' OR (u.role = 'recipient' AND u.blood_group IS NOT NULL))
       AND d.is_available = true
     ORDER BY u.full_name
    """
  )
}

# One emergency request plus the donor groups that can support it.
# Mirrors `GET /emergency/:id` (optional auth).
query GetEmergencyRequest($id: UUID!)
  @auth(level: PUBLIC, insecureReason: "Anyone may view a single emergency request to decide they can help.") {
  request: _selectFirst(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           null AS "donorResponse",
           null AS "donorStage",
           false AS "acceptedByOtherDonor",
           CASE r.blood_group
             WHEN 'O-'  THEN jsonb_build_array('O-')
             WHEN 'O+'  THEN jsonb_build_array('O-', 'O+')
             WHEN 'A-'  THEN jsonb_build_array('O-', 'A-')
             WHEN 'A+'  THEN jsonb_build_array('O-', 'O+', 'A-', 'A+')
             WHEN 'B-'  THEN jsonb_build_array('O-', 'B-')
             WHEN 'B+'  THEN jsonb_build_array('O-', 'O+', 'B-', 'B+')
             WHEN 'AB-' THEN jsonb_build_array('O-', 'A-', 'B-', 'AB-')
             ELSE            jsonb_build_array('O-', 'O+', 'A-', 'A+', 'B-', 'B+', 'AB-', 'AB+')
           END AS "compatibleDonorGroups"
      FROM emergency_requests r
     WHERE r.id = $1::uuid
    """,
    params: [$id]
  )
}

# ---------------------------------------------------------------------------
# Emergency request lists (role-branched, mirrors `GET /emergency`)
# ---------------------------------------------------------------------------

# The recipient's own requests, newest first.
query ListMyRequests @auth(level: USER) {
  requests: _select(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           null AS "donorResponse",
           null AS "donorStage",
           false AS "acceptedByOtherDonor"
      FROM emergency_requests r
     WHERE r.requester_uid = $1
     ORDER BY r.created_at DESC
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# Incoming request feed for a donor: open requests their blood type can serve,
# with their own response state and whether another donor already accepted.
query ListDonorFeed @auth(level: USER) {
  requests: _select(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           dr.response AS "donorResponse",
           dr.stage AS "donorStage",
           EXISTS (
             SELECT 1 FROM donor_request_responses accepted
              WHERE accepted.request_id = r.id
                AND accepted.response = 'accepted'
                AND accepted.donor_uid <> $1
           ) AS "acceptedByOtherDonor"
      FROM emergency_requests r
      LEFT JOIN donor_request_responses dr
        ON dr.request_id = r.id AND dr.donor_uid = $1
     WHERE r.status IN ('pending', 'verified')
       AND EXISTS (SELECT 1 FROM users u WHERE u.uid = $1 AND (u.role = 'donor' OR (u.role = 'recipient' AND u.blood_group IS NOT NULL)))
       AND r.blood_group IN (
         CASE (SELECT blood_group FROM users WHERE uid = $1)
           WHEN 'O-'  THEN ARRAY['O-','O+','A-','A+','B-','B+','AB-','AB+']
           WHEN 'O+'  THEN ARRAY['O+','A+','B+','AB+']
           WHEN 'A-'  THEN ARRAY['A-','A+','AB-','AB+']
           WHEN 'A+'  THEN ARRAY['A+','AB+']
           WHEN 'B-'  THEN ARRAY['B-','B+','AB-','AB+']
           WHEN 'B+'  THEN ARRAY['B+','AB+']
           WHEN 'AB-' THEN ARRAY['AB-','AB+']
           WHEN 'AB+' THEN ARRAY['AB+']
           ELSE ARRAY[]::text[]
         END
       )
     ORDER BY CASE r.urgency
                WHEN 'critical' THEN 0
                WHEN 'urgent' THEN 1
                ELSE 2
              END,
              r.created_at DESC
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# Open triage queue for hospital staff and admins.
query ListTriageQueue @auth(level: USER) {
  requests: _select(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           null AS "donorResponse",
           null AS "donorStage",
           false AS "acceptedByOtherDonor"
      FROM emergency_requests r
     WHERE r.status IN ('pending', 'verified')
       AND EXISTS (
         SELECT 1 FROM users u
          WHERE u.uid = $1
            AND u.role IN ('hospital', 'admin')
            AND (u.role = 'admin' OR u.is_verified = true)
       )
     ORDER BY CASE r.urgency
                WHEN 'critical' THEN 0
                WHEN 'urgent' THEN 1
                ELSE 2
              END,
              r.created_at DESC
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# ---------------------------------------------------------------------------
# Donor dashboard reads
# ---------------------------------------------------------------------------

# The donor's accepted cases (active + completed history).
# Mirrors `GET /donors/me/commitments`.
query ListDonorCommitments @auth(level: USER) {
  commitments: _select(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           dr.response AS "donorResponse",
           dr.stage AS "donorStage",
           false AS "acceptedByOtherDonor"
      FROM donor_request_responses dr
      JOIN emergency_requests r ON r.id = dr.request_id
     WHERE dr.donor_uid = $1 AND dr.response = 'accepted'
     ORDER BY CASE dr.stage
                WHEN 'en_route' THEN 0
                WHEN 'accepted' THEN 1
                WHEN 'arrived' THEN 2
                ELSE 3
              END,
              dr.updated_at DESC
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# Every response the donor created, including declined ones.
# Mirrors `GET /donors/me/responses`.
query ListDonorResponses @auth(level: USER) {
  responses: _select(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           dr.response AS "donorResponse",
           dr.stage AS "donorStage",
           false AS "acceptedByOtherDonor",
           dr.created_at AS "responseCreatedAt",
           dr.updated_at AS "responseUpdatedAt"
      FROM donor_request_responses dr
      JOIN emergency_requests r ON r.id = dr.request_id
     WHERE dr.donor_uid = $1
     ORDER BY dr.updated_at DESC
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# The donor's availability switch; a missing row reads as paused.
# Mirrors `GET /donors/me/availability`.
query GetDonorAvailability @auth(level: USER) {
  availability: _select(
    sql: """
    SELECT da.is_available AS "isAvailable",
           da.last_donation_at AS "lastDonationAt",
           true AS "recordExists"
      FROM donor_availability da
     WHERE da.user_id = $1
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# Privacy-safe Find Donors page: available donors, initials + group + district.
# Mirrors `GET /donors/directory`.
query SearchDonorDirectory($bloodGroup: String, $district: String) @auth(level: USER) {
  donors: _select(
    sql: """
    SELECT u.full_name AS "fullName",
           u.blood_group AS "bloodGroup",
           u.district AS district
      FROM users u
      JOIN donor_availability d ON d.user_id = u.uid
     WHERE u.role = 'donor'
       AND d.is_available = true
       AND u.blood_group IS NOT NULL
       AND ($2::text IS NULL OR u.blood_group = $2)
       AND ($3::text IS NULL OR u.district = $3)
       AND EXISTS (SELECT 1 FROM users uu WHERE uu.uid = $1)
     ORDER BY u.full_name
     LIMIT 50
    """,
    params: [{_expr: "auth.uid"}, $bloodGroup, $district]
  )
}

# ---------------------------------------------------------------------------
# Hospital reads
# ---------------------------------------------------------------------------

# The storage screen: every bank the staff member may manage, with inventory.
# Mirrors `GET /hospital/inventory`.
query GetHospitalInventory @auth(level: USER) {
  banks: _select(
    sql: """
    SELECT jsonb_build_object(
             'id', b.id,
             'name', b.name,
             'district', b.district,
             'inventory', COALESCE((
               SELECT jsonb_agg(jsonb_build_object(
                          'bloodGroup', bi.blood_group,
                          'component', bi.component,
                          'units', bi.units,
                          'updatedAt', bi.updated_at)
                         ORDER BY bi.blood_group, bi.component)
                 FROM blood_inventory bi WHERE bi.bank_id = b.id
             ), '[]'::jsonb)
           ) AS "bank"
      FROM blood_banks b
      JOIN users u ON u.uid = $1
     WHERE u.role = 'admin'
        OR (u.role = 'hospital' AND u.is_verified = true AND b.district = u.district)
     ORDER BY b.name
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# Live numbers for the transmission screen.
# Mirrors `GET /hospital/requests/:id/candidates`.
query GetRequestCandidates($requestId: UUID!) @auth(level: USER) {
  candidates: _selectFirst(
    sql: """
    SELECT r.id AS "requestId",
           r.status AS status,
           r.blood_group AS "bloodGroup",
           (SELECT COUNT(*)::int
              FROM users u
              JOIN donor_availability d ON d.user_id = u.uid
              JOIN unnest(CASE r.blood_group
                             WHEN 'O-'  THEN ARRAY['O-']
                             WHEN 'O+'  THEN ARRAY['O-','O+']
                             WHEN 'A-'  THEN ARRAY['O-','A-']
                             WHEN 'A+'  THEN ARRAY['O-','O+','A-','A+']
                             WHEN 'B-'  THEN ARRAY['O-','B-']
                             WHEN 'B+'  THEN ARRAY['O-','O+','B-','B+']
                             WHEN 'AB-' THEN ARRAY['O-','A-','B-','AB-']
                             ELSE            ARRAY['O-','O+','A-','A+','B-','B+','AB-','AB+']
                           END) AS g(grp) ON g.grp = u.blood_group
             WHERE u.role = 'donor' AND d.is_available = true) AS "compatibleAvailable",
           COALESCE((
             SELECT SUM(CASE WHEN response = 'accepted' THEN 1 ELSE 0 END)
               FROM donor_request_responses WHERE request_id = r.id
           ), 0)::int AS accepted,
           COALESCE((
             SELECT SUM(CASE WHEN response = 'accepted'
                              AND stage IN ('en_route', 'arrived', 'completed') THEN 1 ELSE 0 END)
               FROM donor_request_responses WHERE request_id = r.id
           ), 0)::int AS "enRoute"
      FROM emergency_requests r
      JOIN users u ON u.uid = $2
     WHERE r.id = $1::uuid
       AND (u.role = 'admin' OR (u.role = 'hospital' AND u.is_verified = true))
    """,
    params: [$requestId, {_expr: "auth.uid"}]
  )
}

# The accepted donor's full case file for one request, for hospital staff.
# Mirrors `GET /hospital/requests/:id/responses`.
query GetRequestWorkflow($requestId: UUID!) @auth(level: USER) {
  workflow: _selectFirst(
    sql: """
    SELECT r.id AS "requestId",
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           d.id AS "responseId",
           d.stage AS stage,
           d.created_at AS "acceptedAt",
           du.id AS "donorId",
           du.full_name AS "donorFullName",
           du.blood_group AS "donorBloodGroup",
           du.district AS "donorDistrict",
           s.temperature AS temperature,
           s.blood_pressure AS "bloodPressure",
           s.pulse AS pulse,
           s.hemoglobin AS hemoglobin,
           s.eligible AS eligible,
           s.bed_label AS "bedLabel",
           s.screened_by_uid AS "screenedByUid",
           s.created_at AS "screeningCreatedAt",
           es.status AS "extractionStatus",
           es.volume_ml AS "volumeMl",
           es.phlebotomist_name AS "phlebotomistName",
           es.started_at AS "startedAt",
           es.completed_at AS "completedAt"
      FROM emergency_requests r
      LEFT JOIN LATERAL (
             SELECT * FROM donor_request_responses
              WHERE request_id = r.id AND response = 'accepted'
              ORDER BY updated_at DESC LIMIT 1
      ) d ON true
      LEFT JOIN LATERAL (
             SELECT * FROM donor_screening
              WHERE response_id = d.id
              ORDER BY created_at DESC LIMIT 1
      ) s ON true
      LEFT JOIN LATERAL (
             SELECT * FROM extraction_sessions
              WHERE response_id = d.id
              ORDER BY started_at DESC LIMIT 1
      ) es ON true
      LEFT JOIN users du ON du.uid = d.donor_uid
      JOIN users u ON u.uid = $2
     WHERE r.id = $1::uuid
       AND (u.role = 'admin' OR (u.role = 'hospital' AND u.is_verified = true))
    """,
    params: [$requestId, {_expr: "auth.uid"}]
  )
}

# The donor's own single commitment for one request.
# Mirrors `GET /donors/requests/:requestId/commitment`.
query GetDonorCommitment($requestId: UUID!) @auth(level: USER) {
  commitment: _selectFirst(
    sql: """
    SELECT r.id AS id,
           r.patient_name AS "patientName",
           r.blood_group AS "bloodGroup",
           r.units AS units,
           r.hospital AS hospital,
           r.district AS district,
           r.contact_name AS "contactName",
           r.contact_mobile AS "contactMobile",
           r.urgency AS urgency,
           r.notes AS notes,
           r.status AS status,
           r.created_at AS "createdAt",
           r.updated_at AS "updatedAt",
           r.requester_uid IS NULL AS "isAnonymous",
           dr.response AS "donorResponse",
           dr.stage AS "donorStage",
           dr.id AS "responseId",
           false AS "acceptedByOtherDonor"
      FROM donor_request_responses dr
      JOIN emergency_requests r ON r.id = dr.request_id
     WHERE dr.request_id = $1::uuid
       AND dr.response = 'accepted'
       AND dr.donor_uid = $2
    """,
    params: [$requestId, {_expr: "auth.uid"}]
  )
}

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------

# The signed-in user's notification feed plus unread count.
# Mirrors `GET /alerts`.
query ListAlerts @auth(level: USER) {
  feed: _selectFirst(
    sql: """
    SELECT COALESCE((
             SELECT jsonb_agg(jsonb_build_object(
                        'id', a.id,
                        'type', a.type,
                        'requestId', a.request_id,
                        'title', a.title,
                        'body', a.body,
                        'readAt', a.read_at,
                        'createdAt', a.created_at)
                       ORDER BY a.created_at DESC)
               FROM (SELECT * FROM alerts
                      WHERE user_uid = $1
                      ORDER BY created_at DESC
                      LIMIT 100) a
           ), '[]'::jsonb) AS "alerts",
           (SELECT COUNT(*)::int FROM alerts
             WHERE user_uid = $1 AND read_at IS NULL) AS "unreadCount"
    """,
    params: [{_expr: "auth.uid"}]
  )
}

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------

# Per-role dashboard stats and (for donors) availability state.
# Requests are fetched separately through the role-appropriate list query.
# Mirrors `GET /dashboard/me`.
query GetDashboardSummary @auth(level: USER) {
  summary: _selectFirst(
    sql: """
    WITH me AS (
      SELECT u.uid, u.role, u.blood_group, u.district,
             da.is_available, da.last_donation_at
        FROM users u
        LEFT JOIN donor_availability da ON da.user_id = u.uid
       WHERE u.uid = $1
    )
    SELECT jsonb_build_object(
             'role', me.role,
             'stats', CASE me.role
               WHEN 'donor' THEN jsonb_build_array(
                 jsonb_build_object('key', 'availability', 'label', 'Your availability',
                   'value', CASE WHEN me.is_available IS TRUE THEN 'Active' ELSE 'Paused' END,
                   'hint', CASE WHEN me.is_available IS TRUE THEN 'You are receiving alerts'
                                ELSE 'You are hidden from dispatch' END),
                 jsonb_build_object('key', 'matching', 'label', 'Matching requests',
                   'value', CASE WHEN me.blood_group IS NOT NULL THEN
                     (SELECT COUNT(*)::text FROM emergency_requests r
                        JOIN unnest(CASE me.blood_group
                                       WHEN 'O-'  THEN ARRAY['O-','O+','A-','A+','B-','B+','AB-','AB+']
                                       WHEN 'O+'  THEN ARRAY['O+','A+','B+','AB+']
                                       WHEN 'A-'  THEN ARRAY['A-','A+','AB-','AB+']
                                       WHEN 'A+'  THEN ARRAY['A+','AB+']
                                       WHEN 'B-'  THEN ARRAY['B-','B+','AB-','AB+']
                                       WHEN 'B+'  THEN ARRAY['B+','AB+']
                                       WHEN 'AB-' THEN ARRAY['AB-','AB+']
                                       ELSE            ARRAY['AB+'] END) AS g(grp)
                           ON g.grp = r.blood_group
                       WHERE r.status IN ('pending', 'verified'))
                     ELSE '0' END,
                   'hint', CASE WHEN me.blood_group IS NOT NULL
                                THEN 'Compatible with ' || me.blood_group
                                ELSE 'Set your blood group' END),
                 jsonb_build_object('key', 'open', 'label', 'Open nationwide',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE status IN ('pending', 'verified')),
                   'hint', 'Awaiting a donor')
               )
               WHEN 'recipient' THEN jsonb_build_array(
                 jsonb_build_object('key', 'open', 'label', 'Your open requests',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE requester_uid = me.uid AND status IN ('pending', 'verified')),
                   'hint', 'Being matched with donors'),
                 jsonb_build_object('key', 'fulfilled', 'label', 'Fulfilled',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE requester_uid = me.uid AND status = 'fulfilled'),
                   'hint', 'Completed successfully'),
                 jsonb_build_object('key', 'donors', 'label', 'Donors online',
                   'value', (SELECT COUNT(*)::text FROM users u
                              JOIN donor_availability d ON d.user_id = u.uid
                             WHERE u.role = 'donor' AND d.is_available = true),
                   'hint', 'Available to respond')
               )
               WHEN 'hospital' THEN jsonb_build_array(
                 jsonb_build_object('key', 'pending', 'label', 'Pending verification',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE status IN ('pending', 'verified')),
                   'hint', 'Awaiting your review'),
                 jsonb_build_object('key', 'critical', 'label', 'Critical',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE status IN ('pending', 'verified') AND urgency = 'critical'),
                   'hint', 'Highest priority'),
                 jsonb_build_object('key', 'donors', 'label', 'Registered donors',
                   'value', (SELECT COUNT(*)::text FROM users WHERE role = 'donor'),
                   'hint', 'In the national pool')
               )
               ELSE jsonb_build_array(
                 jsonb_build_object('key', 'users', 'label', 'Total accounts',
                   'value', (SELECT COUNT(*)::text FROM users),
                   'hint', (SELECT (COUNT(*) FILTER (WHERE role = 'donor'))::text FROM users) || ' donors'),
                 jsonb_build_object('key', 'queue', 'label', 'Triage queue',
                   'value', (SELECT COUNT(*)::text FROM emergency_requests
                              WHERE status IN ('pending', 'verified')),
                   'hint', 'Open requests'),
                 jsonb_build_object('key', 'unverified', 'label', 'Unverified hospitals',
                   'value', (SELECT COUNT(*)::text FROM users
                              WHERE role = 'hospital' AND is_verified = false),
                   'hint', 'Need review')
               )
             END,
             'availability', CASE WHEN me.role = 'donor' OR (me.role = 'recipient' AND me.blood_group IS NOT NULL)
               THEN jsonb_build_object('isAvailable', me.is_available IS TRUE,
                                       'lastDonationAt', me.last_donation_at,
                                       'recordExists', me.is_available IS NOT NULL)
               ELSE 'null'::jsonb END
           ) AS "summary"
      FROM me
    """,
    params: [{_expr: "auth.uid"}]
  )
}
