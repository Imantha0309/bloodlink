# BloodLink — Firebase SQL Connect schema.
#
# Ported from the retired Express + SQLite backend.
# The `sessions` and `password_resets` tables are intentionally absent —
# Firebase Auth owns those concerns now.
#
# Conventions:
#   - The `user` table is keyed by the Firebase Auth uid (`auth.uid`).
#   - `bloodGroup` is a String because GraphQL enum values cannot contain "+".
#   - Every other domain enum uses lowercase GraphQL enum values so the values
#     match the strings the app already sends (e.g. `accepted`, `critical`).

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

"""Roles a user row may carry. `admin` is provisioned internally only."""
enum UserRole {
  recipient
  donor
  hospital
  admin
}

"""Triage priority behind the donor feed and queue ordering."""
enum UrgencyLevel {
  critical
  urgent
  standard
}

"""Lifecycle of an emergency request. Terminal states never reopen."""
enum RequestStatus {
  pending
  verified
  fulfilled
  cancelled
}

"""A donor's persisted decision against a request."""
enum DonorResponse {
  accepted
  declined
}

"""A donor's progress through the intake pipeline."""
enum DonationStage {
  accepted
  en_route
  arrived
  completed
}

"""Blood component held in bank inventory."""
enum BloodComponent {
  whole_blood
  prbc
  platelets
  plasma
}

"""In-app feed notification type."""
enum AlertType {
  new_match
  status_change
  donor_accepted
  request_fulfilled
}

"""Extraction session lifecycle."""
enum ExtractionStatus {
  in_progress
  completed
}

# ---------------------------------------------------------------------------
# Tables
# ---------------------------------------------------------------------------

"""A person on the platform. Keyed by the Firebase Auth uid."""
type User @table(name: "users", key: ["uid"]) {
  uid: String!
  role: UserRole!
  fullName: String!
  email: String @unique
  mobile: String @unique
  district: String
  registrationNumber: String
  bloodGroup: String
  """Hospitals must be admin-verified before they may touch stock or patients."""
  isVerified: Boolean! @default(value: false)
  """FCM device push token — updated on sign-in and replaced on each new login."""
  pushToken: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Generated reverse relations:
  #   donorAvailabilities_on_user: [DonorAvailability!]!
  #   donorRequestResponses_on_donor: [DonorRequestResponse!]!
  #   emergencyRequests_on_requester: [EmergencyRequest!]!
  #   alerts_on_user: [Alert!]!
  #   screeningOnDonorScreenedBy: [DonorScreening!]!
}

"""One-to-one availability switch; presence of a row is not enough — check `isAvailable`."""
type DonorAvailability @table(name: "donor_availability", key: ["userId"]) {
  userId: String!
  isAvailable: Boolean! @default(value: true)
  lastDonationAt: Timestamp
  updatedAt: Timestamp!
}

"""An emergency blood request. Optional owner — the zero-login path is anonymous."""
type EmergencyRequest
  @table(name: "emergency_requests")
  @index(fields: ["status", "createdAt"]) {
  id: UUID!
  requester: User
  patientName: String!
  bloodGroup: String!
  units: Int!
  hospital: String!
  district: String
  registrationNumber: String
  contactName: String!
  contactMobile: String!
  urgency: UrgencyLevel!
  notes: String
  status: RequestStatus! @default(value: "pending")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Generated reverse relations:
  #   donorRequestResponses_on_request: [DonorRequestResponse!]!
  #   alerts_on_request: [Alert!]!
}

"""A donor's decision on a request. One row per (request, donor)."""
type DonorRequestResponse
  @table(name: "donor_request_responses")
  @unique(fields: ["request", "donor"])
  @index(fields: ["donorUid", "updatedAt"]) {
  id: UUID!
  request: EmergencyRequest!
  donor: User!
  response: DonorResponse!
  """Donation progress; a response can only change while still `accepted`."""
  stage: DonationStage! @default(value: "accepted")
  checkinTokenHash: String
  checkinTokenExpiresAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Generated reverse relations:
  #   donorScreenings_on_response: [DonorScreening!]!
  #   extractionSessions_on_response: [ExtractionSession!]!
}

"""A blood facility and its contact details."""
type BloodBank @table(name: "blood_banks") {
  id: UUID!
  name: String!
  district: String!
  address: String
  phone: String
  hours: String
  isVerified: Boolean! @default(value: false)
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")

  # Generated reverse relations:
  #   bloodInventories_on_bank: [BloodInventory!]!
}

"""One stock line: a single (bank, blood group, component) combination."""
type BloodInventory
  @table(name: "blood_inventory")
  @unique(fields: ["bank", "bloodGroup", "component"]) {
  id: UUID!
  bank: BloodBank!
  bloodGroup: String!
  component: BloodComponent!
  units: Int! @default(value: 0)
  updatedAt: Timestamp! @default(expr: "request.time")
}

"""In-app notification feed, always scoped to its owner."""
type Alert
  @table(name: "alerts")
  @index(fields: ["userUid", "createdAt"]) {
  id: UUID!
  user: User!
  type: AlertType!
  request: EmergencyRequest
  title: String!
  body: String!
  readAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}

"""Intake vitals recorded by hospital staff for the accepted donor."""
type DonorScreening
  @table(name: "donor_screening")
  @index(fields: ["responseId"]) {
  id: UUID!
  response: DonorRequestResponse!
  temperature: String
  bloodPressure: String
  pulse: String
  hemoglobin: String
  eligible: Boolean! @default(value: true)
  bedLabel: String
  screenedBy: User
  createdAt: Timestamp! @default(expr: "request.time")
}

"""A donation extraction session started by hospital staff."""
type ExtractionSession
  @table(name: "extraction_sessions")
  @index(fields: ["responseId"]) {
  id: UUID!
  response: DonorRequestResponse!
  volumeMl: Int
  status: ExtractionStatus! @default(value: "in_progress")
  phlebotomistName: String
  startedAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}